[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-task-check"
version = "0.1.0"
description = "Windowless Windows task runner with process-tree timeouts and executable acceptance checks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mark William"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
wintaskcheck = "wintaskcheck.cli:main"

[tool.setuptools.packages.find]
include = ["wintaskcheck*"]
